# CI (docs/design/06-quality-ci-deploy.md §4; AD-3, AD-32, PA-5). Owned by WP11.
#
#   check ─────────────────────────────── lint · typecheck · format · knip · registry · unicode · audit
#   vocab ──┬─ unit                        uv + raw-vocab cache · vocab:fetch · conformance gate · vocab:build · guard
#           │                              (unit: registry:check --require-built on the vocab-dist artifact · pnpm test)
#           ├─ build ──┬─ e2e              vite build · check:dist · wrangler deploy --dry-run → `dist` artifact
#           │          ├─ e2e-headers      Playwright on `wrangler dev --assets apps/web/dist` (workerd applies _headers)
#           │          └─ preview ── lighthouse   PRs only, and only when the Cloudflare secrets exist (cf-secrets)
#           └─ fuzz-smoke                  engines/agenda/unicode changes, once WP12 ships test:fuzz
#   preview-cleanup                        PR closed: delete the pr-<n> preview
#
# PA-5 ramp: e2e runs chromium only; firefox/webkit, the device/viewport projects (E2E_FULL_MATRIX=1), shards and visual
# baselines arrive with WP11's wave-3 pass. deploy.yml deploys the `dist` artifact of a green run on main (never on push).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # AD-32: the repository variable is `strict` since wave 2 merged both engines (WP05A + WP05B); it was
  # `skip-missing-engine` while one engine factory was missing. The conformance gate in the vocab job fails whenever
  # both engines exist and the mode is weaker. An unset variable means strict.
  CONFORMANCE_MODE: ${{ vars.CONFORMANCE_MODE }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  # Exposes whether the Cloudflare secrets are available to this run (they are not on forks, on Dependabot PRs or before
  # docs/release.md's one-time setup), so preview / lighthouse / preview-cleanup skip instead of failing.
  cf-secrets:
    name: cloudflare secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      has_cf_secrets: ${{ steps.probe.outputs.has_cf_secrets }}
    steps:
      - id: probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "has_cf_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare secrets absent::preview, lighthouse and preview cleanup are skipped (see docs/release.md, one-time account setup)."
          fi

  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm registry:check
      - run: pnpm unicode:check
      - run: pnpm audit --prod

  vocab:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/oracle/uv.lock
      - run: uv sync --project tools/oracle --locked
      - name: Restore raw vocabulary (keyed on the manifest hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/vocab/raw
          key: vocab-raw-${{ hashFiles('tools/oracle/manifest.json') }}
      - name: vocab:fetch (sha256-verified; a no-op on a cache hit)
        run: pnpm vocab:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Conformance gate (AD-32)
        run: pnpm conformance:gate
      - name: vocab:build
        run: pnpm vocab:build --conformance "${CONFORMANCE_MODE:-strict}"
      - name: Vocabulary guards (03 §C.8)
        run: pnpm vocab:guard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vocab-dist
          path: data/vocab/dist
          if-no-files-found: error
          retention-days: 7

  unit:
    needs: vocab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vocab-dist
          path: data/vocab/dist
      - name: Restore raw vocabulary (conformance on raw tables)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/vocab/raw
          key: vocab-raw-${{ hashFiles('tools/oracle/manifest.json') }}
      # The built-asset half of registry:check (maxTokenBytes === META.maxPieceBytes, id facts; WP04 acceptance, Gate 3):
      # the `check` job has no data/vocab/dist, so it runs here on the downloaded artifact and fails if nothing was compared.
      - name: registry:check against the built assets
        run: node packages/registry/scripts/registry-check.ts --require-built
      - run: pnpm test

  build:
    needs: vocab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vocab-dist
          path: data/vocab/dist
      # vite build → check:dist (guards + size-limit) → wrangler deploy --dry-run; vocab:build already ran in `vocab`.
      - run: pnpm build:site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          # main: 30 days, so re-running an older deploy redeploys its tested artifact (docs/release.md § Rollback).
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  e2e:
    name: e2e (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PA-5: chromium only. Wave 3 adds firefox/webkit (and E2E_FULL_MATRIX=1 for the device/viewport projects) + shards.
        include:
          - project: chromium
            browser: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @tsbs/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @tsbs/e2e exec playwright install-deps ${{ matrix.browser }}
      - run: pnpm e2e --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  e2e-headers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @tsbs/e2e exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @tsbs/e2e exec playwright install-deps chromium
      # Starts `wrangler dev --assets apps/web/dist` (playwright.headers.config.ts) and runs the 06 §7 smoke checks on it.
      - run: pnpm e2e:headers
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-headers-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  preview:
    needs: [build, cf-secrets]
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.cf-secrets.outputs.has_cf_secrets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
      - id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.152.0'
          command: preview --name pr-${{ github.event.pull_request.number }} --message "ci ${{ github.sha }}"
      - name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.preview-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$URL" || { echo "::error::wrangler preview printed no preview URL"; exit 1; }
          body="Preview for ${SHA}: ${URL}"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @tsbs/e2e exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @tsbs/e2e exec playwright install-deps chromium
      - name: e2e:headers against the preview (real edge)
        run: pnpm e2e:headers
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.preview-url }}
      - name: Deploy smoke (06 §7) against the preview
        run: pnpm deploy:smoke --url "$URL"
        env:
          URL: ${{ steps.preview.outputs.preview-url }}

  lighthouse:
    needs: preview
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # pnpm 12 installs before running a script anyway; @lhci/cli itself comes through `pnpm dlx` (exact version in the
      # root `lhci` script) so its ~140 MB of Lighthouse dependencies stay out of every other job's install.
      - run: pnpm install --frozen-lockfile
      # lighthouserc.json: mobile preset, Lighthouse "Slow 4G", the 06 §3 budgets as assertions. Never against vite preview.
      - run: pnpm lhci --collect.url="$URL"
        env:
          URL: ${{ needs.preview.outputs.url }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  fuzz-smoke:
    needs: vocab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Runs only when packages/core/src/{engines,agenda,unicode}/** changed and WP12 has replaced the test:fuzz stub.
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if jq -e '.scripts["test:fuzz"] | contains("scripts/pending.ts")' package.json > /dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::test:fuzz is still the WP12 stub; fuzz-smoke skipped."; exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^packages/core/src/(engines|agenda|unicode)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vocab-dist
          path: data/vocab/dist
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/vocab/raw
          key: vocab-raw-${{ hashFiles('tools/oracle/manifest.json') }}
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test:fuzz --seed 20261025 --n 2000

  preview-cleanup:
    needs: cf-secrets
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && needs.cf-secrets.outputs.has_cf_secrets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A PR whose preview never existed (opened before the secrets) has nothing to delete; that is not a failure.
      - continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.152.0'
          command: preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation
