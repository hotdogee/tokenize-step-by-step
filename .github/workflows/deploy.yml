# Production deploy (docs/design/06-quality-ci-deploy.md §4, §7; AD-3). Owned by WP11.
#
# The ONLY trigger is a completed `ci` run on main (never `push`, which would deploy a second time per commit). It deploys
# the exact `dist` artifact that run built and tested — no rebuild — then runs the 06 §7 smoke checks against production
# and a report-only Lighthouse pass. Without the Cloudflare secrets (forks, before docs/release.md's one-time setup) the
# deploy job is skipped and the workflow stays green.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# One production deploy at a time, in order; a queued deploy of a newer commit waits rather than cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # download the artifact of the triggering ci run

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  cf-secrets:
    name: cloudflare secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      has_cf_secrets: ${{ steps.probe.outputs.has_cf_secrets }}
    steps:
      - id: probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "has_cf_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare secrets absent::production deploy skipped (see docs/release.md, one-time account setup)."
          fi

  deploy:
    needs: cf-secrets
    if: >-
      needs.cf-secrets.outputs.has_cf_secrets == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    steps:
      # wrangler.jsonc and the lockfile of the commit that ci tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the dist that ci tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.152.0'
          command: deploy --message "ci ${{ github.event.workflow_run.head_sha }}"
      - id: url
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK: ${{ vars.PRODUCTION_URL }}
        run: |
          url="${DEPLOYED:-$FALLBACK}"
          test -n "$url" || { echo "::error::no deployment URL (set the PRODUCTION_URL repository variable)"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post-deploy smoke (06 §7 items 6–8)
        run: pnpm deploy:smoke --url "$URL"
        env:
          URL: ${{ steps.url.outputs.url }}
      # Report only: a budget miss marks this step failed (visible on the run) without failing the deploy.
      - name: Lighthouse against production (report only)
        continue-on-error: true
        run: pnpm lhci --collect.url="$URL"
        env:
          URL: ${{ steps.url.outputs.url }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-production
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
