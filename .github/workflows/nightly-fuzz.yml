# Nightly fuzz vs oracles, long property runs and performance (docs/design/06-quality-ci-deploy.md §1, §4; WP12).
#
#   fuzz        pnpm test:fuzz --seed <YYYYMMDD> --n 10000: the nine engines (built .bin via readTsbv1) against the Python
#               oracle lane (tools/oracle/fuzz_oracle.py: ids + byte spans) and the second opinions (PA-9)
#   property    fast-check suites of @tsbs/core with FAST_CHECK_NUM_RUNS=20000 (1,000 per PR)
#   perf        Worker heap check (hard); Node timing ceilings and vitest bench (TSBS_PERF=1, serial; soft — shared
#               runners are slower than the quiet machine the 06 §3 Node ceilings assume); the Playwright perf spec on
#               vite preview (budget misses are warnings, the results JSON is the trend artifact)
#
# The property, heap and perf duties run even when an earlier one failed (`!cancelled()`), so one fuzz finding does not
# cost the night its other signals or its trend point. On failure: an issue with the seed, and the fixtures/candidates
# artifact (one file per tokenizer with an engine mismatch, an oracle error or an unclassified divergence, holding every
# case of that run in the fixture case shape with its classification).
name: nightly-fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (default = today's date, YYYYMMDD)
        required: false
      n:
        description: Strings per tokenizer
        required: false
        default: '10000'

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/oracle/uv.lock
      # The Python oracle lane (tiktoken, sentencepiece, tokenizers) that fuzz_oracle.py runs on.
      - run: uv sync --project tools/oracle --locked
      - name: Restore raw vocabulary (keyed on the manifest hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/vocab/raw
          key: vocab-raw-${{ hashFiles('tools/oracle/manifest.json') }}
      - run: pnpm vocab:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The engines under fuzz decode the built assets, exactly as the Worker does; the perf spec needs them in dist/.
      - run: pnpm vocab:build --conformance strict
      # Chromium for the perf spec (and the shared cache key ci uses), through WP11's shared action.
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - id: plan
        env:
          SEED_INPUT: ${{ inputs.seed }}
          N_INPUT: ${{ inputs.n }}
        run: |
          echo "seed=${SEED_INPUT:-$(date -u +%Y%m%d)}" >> "$GITHUB_OUTPUT"
          echo "n=${N_INPUT:-10000}" >> "$GITHUB_OUTPUT"
      - name: Fuzz vs oracles (10,000 strings × 9 tokenizers, date seed)
        run: pnpm test:fuzz --seed "$SEED" --n "$N"
        env:
          SEED: ${{ steps.plan.outputs.seed }}
          N: ${{ steps.plan.outputs.n }}
      # 20,000 fast-check runs per property (1,000 per PR): every property suite lives in the core project and reads
      # FAST_CHECK_NUM_RUNS (packages/core/test/helpers/runs.ts); 20× the runs needs a longer per-test timeout.
      - name: Property tests (20,000 runs)
        if: ${{ !cancelled() }}
        run: pnpm generate && pnpm exec vitest run --project core --test-timeout 600000
        env:
          FAST_CHECK_NUM_RUNS: '20000'
      # 06 §3: 500 keystrokes into a 10k-CJK paragraph grow the Worker's memory by < 10 MB (Node harness, forced GC).
      - name: Worker heap check
        if: ${{ !cancelled() }}
        run: pnpm generate && pnpm exec vitest run --project worker --no-file-parallelism -t "Worker heap"
        env:
          TSBS_PERF: '1'
          NODE_OPTIONS: --expose-gc
      # Serial timing runs (one file at a time): the TSBS_PERF=1 ceilings, then vitest bench + check-bench.ts. Soft:
      # the medians are in the log and the bench JSON artifact; the assertion that counts runs on a quiet machine.
      - name: Node ceilings and vitest bench (TSBS_PERF=1, serial; soft)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm test:perf && pnpm bench
        env:
          TSBS_PERF: '1'
          NODE_OPTIONS: --expose-gc
      - name: Build the site for the perf spec
        if: ${{ !cancelled() }}
        run: pnpm --filter @tsbs/web build
      # Fast 4G load, keystroke latency at 1k/10k, 2,000-cell render, scrub traces. Budget misses are warnings.
      - name: Perf spec (vite preview, chromium)
        if: ${{ !cancelled() }}
        run: pnpm e2e:perf
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-trend-${{ steps.plan.outputs.seed }}
          path: |
            e2e/test-results/perf/perf-results.json
            packages/core/node_modules/.cache/tsbs/bench.json
          if-no-files-found: ignore
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-candidates-${{ steps.plan.outputs.seed }}
          path: fixtures/candidates
          if-no-files-found: ignore
          retention-days: 30
      - name: Open an issue with the seed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.plan.outputs.seed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly fuzz failed (seed ${SEED})" \
            --body "The nightly fuzz / property / perf run failed: ${RUN_URL}. Reproduce with \`pnpm test:fuzz --seed ${SEED}\`; candidates (if any) are in the \`fuzz-candidates-${SEED}\` artifact. Triage each divergence as an engine bug, a fixture candidate (\`fixtures/candidates/\`) or \`oracle-divergence\` (06 §2)."
