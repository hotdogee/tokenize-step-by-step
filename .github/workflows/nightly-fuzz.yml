# Nightly fuzz vs oracles, long property runs and the perf spec (docs/design/06-quality-ci-deploy.md §1, §4). Skeleton
# from WP11; WP12 wires the commands (07 §2 WP12 "nightly-fuzz.yml wiring"). Each step runs only once its implementation
# exists, so the schedule stays green before WP12 lands. On failure: an issue with the seed, and the candidates artifact.
name: nightly-fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (default = today's date, YYYYMMDD)
        required: false
      n:
        description: Strings per tokenizer
        required: false
        default: '10000'

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/oracle/uv.lock
      - name: Restore raw vocabulary (keyed on the manifest hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/vocab/raw
          key: vocab-raw-${{ hashFiles('tools/oracle/manifest.json') }}
      - run: pnpm vocab:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # As in ci's `unit` job: the built assets for the .bin conformance and worker-browser suites, and chromium for the
      # Vitest browser-mode projects of `pnpm test` (web-browser fails under CI without it) and the WP12 perf spec.
      - run: pnpm vocab:build --conformance strict
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - id: plan
        env:
          SEED_INPUT: ${{ inputs.seed }}
          N_INPUT: ${{ inputs.n }}
        run: |
          echo "seed=${SEED_INPUT:-$(date -u +%Y%m%d)}" >> "$GITHUB_OUTPUT"
          echo "n=${N_INPUT:-10000}" >> "$GITHUB_OUTPUT"
          if jq -e '.scripts["test:fuzz"] | contains("scripts/pending.ts")' package.json > /dev/null; then
            echo "fuzz=false" >> "$GITHUB_OUTPUT"; echo "::notice::test:fuzz is still the WP12 stub; fuzz skipped."
          else
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fuzz vs oracles (10,000 strings × 9 tokenizers, date seed)
        if: steps.plan.outputs.fuzz == 'true'
        run: pnpm test:fuzz --seed "$SEED" --n "$N"
        env:
          SEED: ${{ steps.plan.outputs.seed }}
          N: ${{ steps.plan.outputs.n }}
      # 20,000 fast-check runs per property (1,000 per PR); WP12 makes the property suites read FAST_CHECK_NUM_RUNS.
      - name: Property tests (20,000 runs)
        run: pnpm test
        env:
          FAST_CHECK_NUM_RUNS: '20000'
      - name: Perf spec (WP12)
        if: hashFiles('e2e/perf/**') != ''
        run: pnpm --filter @tsbs/e2e exec playwright test --config perf/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-candidates-${{ steps.plan.outputs.seed }}
          path: fixtures/candidates
          if-no-files-found: ignore
          retention-days: 30
      - name: Open an issue with the seed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.plan.outputs.seed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly fuzz failed (seed ${SEED})" \
            --body "The nightly fuzz / property / perf run failed: ${RUN_URL}. Reproduce with \`pnpm test:fuzz --seed ${SEED}\`; candidates (if any) are in the \`fuzz-candidates-${SEED}\` artifact. Triage each divergence as an engine bug, a fixture candidate (\`fixtures/candidates/\`) or \`oracle-divergence\` (06 §2)."
