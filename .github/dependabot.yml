# Weekly grouped dependency updates (docs/design/06-quality-ci-deploy.md §4). Dependabot PRs get no repository secrets,
# so their CI skips preview/lighthouse (cf-secrets) and still runs every other gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
