# Playwright browsers for a CI job (docs/design/06-quality-ci-deploy.md §4 "Caching"). Owned by WP11.
#
# One step for every job that drives a browser (unit: Vitest browser mode; e2e; e2e-headers; preview; visual-baselines;
# nightly-fuzz): restores ~/.cache/ms-playwright keyed on the runner OS, the exact @playwright/test version of
# e2e/package.json and the browser list; on a miss installs the browsers with their system dependencies, on a hit only
# the system dependencies (apt packages are not cached). `cjk-fonts` adds fonts-noto-cjk, which the e2e projects and the
# Linux visual baselines render CJK text with (06 §1). Needs `pnpm install` to have run (the e2e package's Playwright CLI).
name: Playwright browsers
description: Restore or install Playwright browsers (cached per Playwright version) and optionally fonts-noto-cjk.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install (chromium, firefox, webkit).
    required: true
  cjk-fonts:
    description: "'true' to also install fonts-noto-cjk."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
        echo "browsers=$(echo "$BROWSERS" | tr -s ' ' '\n' | sort | paste -sd- -)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.key.outputs.version }}-${{ steps.key.outputs.browsers }}
    # apt on the runners has stalled for whole jobs on the Azure mirror (webkit's install-deps pulls ~60 packages);
    # a stalled transfer now times out after 20 s and is retried, and each install step has a hard 10-minute cap
    # with one retry, so the job always ends inside its 20-minute limit.
    - shell: bash
      run: |
        printf 'Acquire::http::Timeout "20";\nAcquire::Retries "3";\nAcquire::ForceIPv4 "true";\n' | sudo tee /etc/apt/apt.conf.d/99-tsbs-timeouts >/dev/null
    # Browser binaries come from Playwright's CDN (fast) on a cache miss; their apt dependencies are installed from a
    # cached archive directory keyed on the Playwright version and browser list, so the slow or stalling Azure apt
    # mirror is hit once per Playwright bump instead of on every shard. The package list is Playwright's own
    # (`install-deps --dry-run`); if that parse ever yields nothing, the plain install-deps runs with a cap.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        for attempt in 1 2; do
          timeout 600 pnpm --filter @tsbs/e2e exec playwright install $BROWSERS && exit 0
          echo "::warning::playwright install attempt ${attempt} failed or stalled; retrying"
        done
        exit 1
    - id: apt-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: apt-deps-${{ runner.os }}-${{ steps.key.outputs.version }}-${{ steps.key.outputs.browsers }}-noble-1
    - shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        ARCHIVES="$HOME/.cache/apt-archives"
        mkdir -p "$ARCHIVES/partial"
        # The dry run prints the apt command Playwright would run (stdout or stderr depending on the version); an
        # unparseable output must not abort the step under `set -e`, so every stage tolerates an empty result.
        DRY=$(pnpm --filter @tsbs/e2e exec playwright install-deps --dry-run $BROWSERS 2>&1 || true)
        echo "$DRY" | head -5
        PKGS=$( (echo "$DRY" | grep -o 'apt-get install[^"]*' || true) | sed 's/apt-get install//; s/ -y//; s/--no-install-recommends//' | tr -s '[:space:]' ' ' || true)
        if [ -z "$PKGS" ]; then
          echo "::warning::could not read the dependency list from install-deps --dry-run; running install-deps directly"
          timeout 600 pnpm --filter @tsbs/e2e exec playwright install-deps $BROWSERS
          exit $?
        fi
        echo "packages: $PKGS"
        sudo apt-get update -o Acquire::http::Timeout=20 -o Acquire::Retries=3 -o Acquire::ForceIPv4=true >/dev/null
        for attempt in 1 2; do
          timeout 480 sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$ARCHIVES" -o Acquire::http::Timeout=20 -o Acquire::Retries=3 -o Acquire::ForceIPv4=true $PKGS && exit 0
          echo "::warning::browser dependency install attempt ${attempt} failed or stalled; retrying"
        done
        exit 1
    - if: inputs.cjk-fonts == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/fonts-noto-cjk
        key: fonts-noto-cjk-${{ runner.os }}-noble-1
    - if: inputs.cjk-fonts == 'true'
      shell: bash
      run: |
        # The 61 MB fonts-noto-cjk download has stalled on the Azure mirror for whole jobs (three shards so far).
        # The .deb is cached per runner image below; on a miss it is fetched with a stall timeout, IPv4 only, two
        # attempts of at most five minutes, so the step always ends well inside the job's 20-minute limit.
        DEB_DIR="$HOME/.cache/fonts-noto-cjk"
        mkdir -p "$DEB_DIR"
        if ! ls "$DEB_DIR"/fonts-noto-cjk_*.deb >/dev/null 2>&1; then
          for attempt in 1 2; do
            (cd "$DEB_DIR" && timeout 300 apt-get download -o Acquire::http::Timeout=20 -o Acquire::Retries=2 -o Acquire::ForceIPv4=true fonts-noto-cjk) && break
            echo "::warning::fonts-noto-cjk download attempt ${attempt} failed or stalled; retrying"
            rm -f "$DEB_DIR"/*.deb; sleep 5
          done
        fi
        ls "$DEB_DIR"/fonts-noto-cjk_*.deb >/dev/null 2>&1 || { echo "::error::fonts-noto-cjk could not be downloaded"; exit 1; }
        sudo apt-get install -y --no-install-recommends fontconfig
        sudo dpkg -i "$DEB_DIR"/fonts-noto-cjk_*.deb
        sudo fc-cache -f >/dev/null
        fc-list :lang=zh-tw family | grep -q 'Noto Sans CJK' || { echo "::error::fonts-noto-cjk did not install"; exit 1; }
