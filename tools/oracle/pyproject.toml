[project]
name = "tokenize-oracle"
version = "0.1.0"
description = "Provenance, fetch and reference-oracle tooling for the tokenize-step-by-step visualizer."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "ctok==1.3.0",
    "huggingface_hub==2.3.0",
    "protobuf==7.36.2",
    "regex==2026.9.29",
    "sentencepiece==0.2.2",
    "tiktoken==0.14.0",
    "tokenizers==0.23.3",
]

[tool.uv]
# Scripts-only project: nothing is built or installed as a package.
package = false

[tool.ruff]
# target-version is inferred from requires-python (py313).
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["oracle_lib", "oracles"]
